[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clangor-visualis-machina"
version = "0.1.0"
description = "Terminal album library and abstract visual player. Code MIT; bundled albums CC0."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aventurine Atalanta" }]
keywords = ["terminal", "player", "omarchy", "theme"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Private :: Do Not Upload",
]
dependencies = ["numpy>=2.0", "Pillow>=11.0"]

[project.scripts]
aav = "clangor_visualis_machina.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clangor_visualis_machina = ["demo/*.toml", "albums/*.html.gz", "artwork/*.jpg"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "pyte>=0.8.2"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "B", "UP", "SIM", "N", "RUF",
  "D",
  "ERA",
  "TD",
]
ignore = [
  "D105", "D107",
  "TD003",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100", "D103"]
"scripts/**" = ["D103"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
